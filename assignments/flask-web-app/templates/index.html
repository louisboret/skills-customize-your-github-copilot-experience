<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Student Roster</title>
  </head>
  <body>
    <h1>Student Roster</h1>
    <p><a href="{{ url_for('add_student') }}">Add a student</a></p>

    {% if students %}
      <ul>
        {% for student in students %}
          <li>{{ student.name }} — Grade {{ student.grade }}</li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No students have been added yet.</p>
    {% endif %}
  </body>
</html>
